{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Plan de Inventario - Centro Estético Antonia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <!-- Header con Logo -->
    <div class="navbar-antonia d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <img src="{% static 'img/logoAntonia.jpeg' %}" alt="Logo Antonia" style="height: 40px; object-fit: contain;">
            <a href="#" class="brand-title text-decoration-none">Centro Estético Antonia</a>
        </div>
        <div class="d-flex align-items-center gap-4">
            <a href="{% url 'inventario_list' %}" class="nav-link-antonia active fw-bold">Inventario</a>
        </div>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="main-container p-4">
                    <h3 class="fw-bold mb-4" style="color: #4a2e35;">{{ titulo }}</h3>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Título del Plan / Solicitud</label>
                            <input type="text" class="form-control" placeholder="Ej: [Urgente] Reposición de Guantes de Nitrilo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Seleccionar Sucursal / Local</label>
                            <select class="form-select" required>
                                {% for sucursal in sucursales %}
                                    <option value="{{ sucursal.id }}">{{ sucursal.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nivel de Prioridad / Estado</label>
                            <select class="form-select">
                                <option value="urgente">Urgente</option>
                                <option value="mensual">Auditoría Mensual</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Observaciones / Insumos Requeridos</label>
                            <textarea class="form-control" rows="3" placeholder="Escriba los insumos que se requieren reabastecer..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn-pink-antonia px-4">Guardar Plan</button>
                            <a href="{% url 'plan_inventario' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
