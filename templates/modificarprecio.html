<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Precio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card p-4 shadow-sm bg-white">
            <h3>Modificar Precio: {{ servicio.nombre }}</h3>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nuevo Precio Base ($):</label>
                    <input type="number" name="precio_base" value="{{ servicio.precio_base }}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                <a href="{% url 'actualizar_precios' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
